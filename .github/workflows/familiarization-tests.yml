name: Familiarization unit tests

# Runs the FSW unit tests on every personal familiarization branch.
# familiarization/main is skipped on purpose: its bugs are planted, so it is expected to fail.
on:
  push:
    branches:
      - "familiarization/**"
      - "!familiarization/main"
  pull_request:
    branches:
      - "familiarization/main"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FSW-mainboard

    steps:
      - name: Check out repository (with splat submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: FSW-mainboard/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Exercise scoreboard
        run: python ../familiarization/check_progress.py

      - name: Run unit tests
        run: python -m pytest tests/ -q
